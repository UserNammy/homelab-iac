---
- name: Converge
  hosts: all
  vars:
    common_timezone: Europe/Paris
    common_sudo_nopasswd: true
    common_admin_users:
      - name: molecule
        comment: Molecule test user
        ssh_keys:
          # Throwaway public key generated for this test only.
          - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICKEqTn9/YF+eTc2Jb/V6qrVXIG0bqHeZwJwSm7M3KKX molecule@test
    common_ufw_rules:
      - { port: "443", proto: tcp, comment: HTTPS }
  tasks:
    - name: Apply the common role
      ansible.builtin.include_role:
        name: common
