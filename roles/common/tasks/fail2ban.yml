---
# python3-systemd is needed for the systemd backend: Debian 12 no longer
# writes /var/log/auth.log by default, so the file backend finds nothing.
- name: Install fail2ban
  ansible.builtin.apt:
    name:
      - fail2ban
      - python3-systemd
    state: present

- name: Configure fail2ban jails
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Ensure fail2ban is enabled and running
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
