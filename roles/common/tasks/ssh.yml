---
# Debian and Ubuntu ship "Include /etc/ssh/sshd_config.d/*.conf" at the top of
# sshd_config, and sshd keeps the first value it reads for most keywords. A
# low-numbered drop-in therefore wins over 50-cloud-init.conf and friends.
- name: Deploy the SSH hardening drop-in
  ansible.builtin.template:
    src: sshd_hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Ensure the SSH daemon is running
  ansible.builtin.service:
    name: "{{ common_ssh_service_name }}"
    state: started
