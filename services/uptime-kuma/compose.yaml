---
# Status page and synthetic checks (HTTP, TCP, DNS, certificate expiry).
# Monitors are configured in the UI and live in ./data, which restic backs up.
name: uptime-kuma

services:
  uptime-kuma:
    image: louislam/uptime-kuma:1.23.16
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    networks:
      - proxy
    security_opt:
      - no-new-privileges:true
    labels:
      traefik.enable: "true"
      traefik.http.routers.uptime-kuma.rule: "Host(`status.${LAB_DOMAIN}`)"
      traefik.http.routers.uptime-kuma.entrypoints: websecure
      traefik.http.routers.uptime-kuma.middlewares: lan-only@file
      traefik.http.services.uptime-kuma.loadbalancer.server.port: "3001"

networks:
  proxy:
    external: true
