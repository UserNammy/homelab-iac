---
# Example inventory for a two-node homelab. Addresses are placeholders:
# adjust them to your LAN. A third host can be added to `homelab` and to
# `docker_hosts` without touching the roles.
all:
  children:
    homelab:
      children:
        docker_hosts:
          hosts:
            edge01:
              ansible_host: 192.168.10.10
            mon01:
              ansible_host: 192.168.10.11
        # Runs Traefik and terminates TLS for every service in the lab.
        proxy:
          hosts:
            edge01:
        # Runs Prometheus, Alertmanager, Grafana and Loki.
        monitoring_server:
          hosts:
            mon01:
